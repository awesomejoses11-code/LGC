<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LGC Miner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        onAuthStateChanged(auth, (u) => {
            if (u) {
                window.currentUser = u;
                onSnapshot(doc(db, 'artifacts', 'lgc-miner-pro', 'users', u.uid, 'state', 'progress'), (s) => { 
                    if(s.exists()) window.sync(s.data()); 
                });
            } else { signInAnonymously(auth); }
        });
        window.save = async (st) => {
            if (!window.currentUser) return;
            await setDoc(doc(db, 'artifacts', 'lgc-miner-pro', 'users', window.currentUser.uid, 'state', 'progress'), { ...st, lastUpdated: Date.now() }, { merge: true });
        };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #05070A; color: white; touch-action: manipulation; margin: 0; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); }
        .nav-link.active { color: #FFD700; border-top: 2px solid #FFD700; background: linear-gradient(to bottom, rgba(255, 215, 0, 0.05), transparent); }
        .tap-float { position: absolute; color: #FFD700; font-weight: 800; font-size: 28px; pointer-events: none; animation: float-up 0.8s ease-out forwards; z-index: 100; text-shadow: 0 0 10px rgba(255,215,0,0.5); }
        @keyframes float-up { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(-120px) scale(1.2); opacity: 0; } }
        .tab-content { height: calc(100vh - 160px); overflow-y: auto; padding: 20px 16px; }
        #tap-btn { transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        #tap-btn:active { transform: scale(0.92); }
    </style>
</head>
<body class="h-screen flex flex-col">
    <nav class="p-4 flex justify-between items-center glass border-b border-white/5 z-50">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-[#FFD700] to-[#B8860B] flex items-center justify-center text-black shadow-[0_0_20px_rgba(255,215,0,0.2)]"><i class="fa-solid fa-gem"></i></div>
            <div><h1 class="text-[10px] font-black uppercase tracking-[0.2em] text-white/40">LGC Network</h1><p id="rank" class="text-xs font-bold text-[#FFD700]">Bronze Miner</p></div>
        </div>
        <div id="ton-connect-button"></div>
    </nav>
    <main class="flex-1 relative">
        <div id="tab-mine" class="tab-content space-y-8">
            <div class="text-center py-4"><p class="text-[10px] font-black uppercase tracking-widest text-white/30 mb-1">Mined Assets</p><h2 id="bal" class="text-6xl font-black tabular-nums tracking-tighter">0</h2></div>
            <div class="flex justify-center py-4 relative">
                <button id="tap-btn" class="w-72 h-72 rounded-full bg-gradient-to-tr from-[#121418] to-[#1e2128] border-[12px] border-white/5 shadow-2xl flex items-center justify-center">
                    <i class="fa-solid fa-hand-pointer text-7xl text-[#FFD700]"></i>
                </button>
            </div>
            <div class="glass p-5 rounded-[2rem] shadow-xl">
                <div class="flex justify-between items-end mb-3">
                    <div><p class="text-[10px] font-black uppercase text-white/30 mb-1">Energy</p><span id="eng-t" class="text-lg font-bold flex items-center gap-2"><i class="fa-solid fa-bolt text-[#FFD700]"></i> 1000 / 1000</span></div>
                    <div class="text-right"><p class="text-[10px] font-black uppercase text-white/30 mb-1">Rate</p><span id="tap-v" class="text-sm font-bold text-[#FFD700]">+10</span></div>
                </div>
                <div class="w-full h-4 bg-white/5 rounded-full overflow-hidden border border-white/5"><div id="eng-b" class="h-full bg-gradient-to-r from-[#FFD700] to-[#FDB931] transition-all" style="width: 100%"></div></div>
            </div>
            <button onclick="switchTab('boost')" class="w-full glass p-6 rounded-2xl flex justify-between items-center"><div class="flex items-center gap-4"><i class="fa-solid fa-rocket text-[#FFD700]"></i><p class="font-bold">Upgrade Rig</p></div><i class="fa-solid fa-chevron-right text-white/20"></i></button>
        </div>
        <div id="tab-tasks" class="tab-content hidden space-y-4">
            <h3 class="text-2xl font-black">Daily Quests</h3>
            <div class="glass p-5 rounded-2xl flex justify-between items-center border-l-4 border-blue-500">
                <div class="flex items-center gap-3"><i class="fa-brands fa-telegram text-blue-400 text-2xl"></i><div><p class="font-bold">Join PrimeChat</p><p class="text-xs text-[#FFD700]">+5,000</p></div></div>
                <button onclick="doTask('tg','https://t.me/PrimeChat001',5000)" class="bg-[#FFD700] text-black px-6 py-2 rounded-xl text-xs font-black">GO</button>
            </div>
            <div class="glass p-5 rounded-2xl flex justify-between items-center border-l-4 border-white">
                <div class="flex items-center gap-3"><i class="fa-brands fa-x-twitter text-2xl"></i><div><p class="font-bold">Follow LGC</p><p class="text-xs text-[#FFD700]">+3,000</p></div></div>
                <button onclick="doTask('tw','https://x.com/lgc_token',3000)" class="bg-[#FFD700] text-black px-6 py-2 rounded-xl text-xs font-black">GO</button>
            </div>
            <div class="glass p-5 rounded-2xl flex justify-between items-center border-l-4 border-cyan-500">
                <div class="flex items-center gap-3"><i class="fa-solid fa-magnifying-glass text-cyan-400 text-2xl"></i><div><p class="font-bold">TON Viewer</p><p class="text-xs text-[#FFD700]">+2,000</p></div></div>
                <button onclick="doTask('tv','https://tonviewer.com',2000)" class="bg-[#FFD700] text-black px-6 py-2 rounded-xl text-xs font-black">GO</button>
            </div>
        </div>
        <div id="tab-withdraw" class="tab-content hidden space-y-6">
            <h3 class="text-2xl font-black">Withdraw</h3>
            <div class="glass p-6 rounded-[2rem] space-y-6">
                <div class="bg-yellow-500/5 p-4 rounded-2xl border border-yellow-500/20 text-xs text-white/60">Min: 15,000 LGC • Fee: 0.1 TON</div>
                <input type="number" id="w-amt" placeholder="Amount" class="w-full bg-black/40 p-5 rounded-2xl border border-white/10 outline-none">
                <button onclick="payout()" class="w-full bg-[#FFD700] text-black font-black py-5 rounded-2xl uppercase">Pay & Withdraw</button>
            </div>
        </div>
        <div id="tab-boost" class="tab-content hidden space-y-4">
            <h3 class="text-2xl font-black mb-4">Upgrades</h3>
            <button onclick="buy('mt')" class="w-full glass p-6 rounded-2xl flex justify-between items-center">
                <div class="text-left"><p class="font-bold">Multitap</p><p class="text-[10px] text-white/40 uppercase">Lvl <span id="l-mt">1</span> • +2 tap</p></div>
                <div class="text-right text-[#FFD700] font-black" id="c-mt">2,000</div>
            </button>
            <button onclick="buy('en')" class="w-full glass p-6 rounded-2xl flex justify-between items-center">
                <div class="text-left"><p class="font-bold">Energy Cap</p><p class="text-[10px] text-white/40 uppercase">Lvl <span id="l-en">1</span> • +500 cap</p></div>
                <div class="text-right text-[#FFD700] font-black" id="c-en">5,000</div>
            </button>
        </div>
        <div id="tab-social" class="tab-content hidden space-y-6 text-center">
            <h3 class="text-2xl font-black">Mining Network</h3>
            <div class="glass p-8 rounded-[2.5rem] border border-white/5">
                <code id="ref-l" class="block text-[10px] break-all text-blue-400 font-mono mb-6">Connect wallet...</code>
                <button onclick="copyR()" class="w-full bg-[#FFD700] text-black font-black py-5 rounded-2xl uppercase">Copy Link</button>
            </div>
        </div>
    </main>
    <nav class="fixed bottom-0 left-0 right-0 h-20 glass flex justify-around items-center border-t border-white/5">
        <button onclick="switchTab('mine')" class="nav-link flex flex-1 flex-col items-center gap-1 active"><i class="fa-solid fa-pickaxe"></i><span class="text-[9px] font-black">MINE</span></button>
        <button onclick="switchTab('tasks')" class="nav-link flex flex-1 flex-col items-center gap-1 text-white/30"><i class="fa-solid fa-list-check"></i><span class="text-[9px] font-black">TASKS</span></button>
        <button onclick="switchTab('withdraw')" class="nav-link flex flex-1 flex-col items-center gap-1 text-white/30"><i class="fa-solid fa-paper-plane"></i><span class="text-[9px] font-black">PAYOUT</span></button>
        <button onclick="switchTab('social')" class="nav-link flex flex-1 flex-col items-center gap-1 text-white/30"><i class="fa-solid fa-users"></i><span class="text-[9px] font-black">FRIENDS</span></button>
    </nav>
    <script>
        let balance = 0, energy = 1000, maxE = 1000, tap = 10, cl = [], lvls = { mt: 1, en: 1 };
        const ton = new TON_CONNECT_UI.TonConnectUI({ manifestUrl: 'https://lgcminer.web.app/tonconnect-manifest.json', buttonRootId: 'ton-connect-button' });
        ton.onStatusChange(w => { document.getElementById('ref-l').innerText = w ? `https://t.me/LGC_Miner_Bot?start=${w.account.address}` : "Connect wallet..."; });
        window.sync = (d) => { balance=d.bal||0; energy=d.en||1000; maxE=d.maxE||1000; tap=d.tap||10; cl=d.cl||[]; lvls=d.lvls||{mt:1,en:1}; update(); };
        function update() {
            document.getElementById('bal').innerText = Math.floor(balance).toLocaleString();
            document.getElementById('eng-t').innerHTML = `<i class="fa-solid fa-bolt text-[#FFD700]"></i> ${Math.floor(energy)} / ${maxE}`;
            document.getElementById('eng-b').style.width = `${(energy/maxE)*100}%`;
            document.getElementById('tap-v').innerText = `+${tap}`;
            document.getElementById('c-mt').innerText = (lvls.mt * 2000).toLocaleString();
            document.getElementById('c-en').innerText = (lvls.en * 5000).toLocaleString();
            document.getElementById('l-mt').innerText = lvls.mt; document.getElementById('l-en').innerText = lvls.en;
            const r = document.getElementById('rank');
            r.innerText = balance > 100000 ? "Gold Miner" : (balance > 25000 ? "Silver Miner" : "Bronze Miner");
        }
        window.doTask = (id, url, r) => { window.open(url, '_blank'); setTimeout(() => { if(!cl.includes(id)) { balance+=r; cl.push(id); update(); sv(); } }, 7000); };
        window.buy = (type) => {
            if(type==='mt' && balance >= lvls.mt*2000) { balance -= lvls.mt*2000; lvls.mt++; tap += 2; }
            else if(type==='en' && balance >= lvls.en*5000) { balance -= lvls.en*5000; lvls.en++; maxE += 500; }
            update(); sv();
        };
        window.payout = async () => {
            const amt = parseInt(document.getElementById('w-amt').value);
            if (!ton.connected || isNaN(amt) || amt < 15000 || amt > balance) return alert("Error: Min 15k & Connect Wallet");
            try {
                await ton.sendTransaction({ validUntil: Math.floor(Date.now()/1000)+300, messages: [{ address: "UQBivI9Kba3YojkZFsQpalTeCFcCyNX1OS-Yed67920TU1pf", amount: "100000000" }] });
                await fetch(`https://api.telegram.org/bot8788748146:AAFA9sVSKAF165LbjNfupIxtABDjMDv8Bso/sendMessage?chat_id=7373026197&text=PAYOUT: ${ton.account.address} - ${amt} LGC`);
                balance -= amt; update(); sv(); alert("Requested!");
            } catch(e) { alert("Tx Failed"); }
        };
        document.getElementById('tap-btn').addEventListener('pointerdown', (e) => { 
            if(energy >= tap) { 
                balance += tap; energy -= tap; createF(e.clientX, e.clientY);
                if(navigator.vibrate) navigator.vibrate(40); update(); sv(); 
            } 
        });
        function createF(x, y) { const f = document.createElement('div'); f.className = 'tap-float'; f.innerText = `+${tap}`; f.style.left = `${x-20}px`; f.style.top = `${y-40}px`; document.body.appendChild(f); setTimeout(() => f.remove(), 800); }
        setInterval(() => { if(energy < maxE) { energy = Math.min(maxE, energy + 3); update(); } }, 1000);
        function sv() { if(window.save) window.save({ bal:balance, en:energy, maxE, tap, cl, lvls }); }
        window.switchTab = (tId) => {
            document.querySelectorAll('.tab-content').forEach(e => e.classList.add('hidden'));
            const tabs = ['mine','tasks','withdraw','social'];
            document.querySelectorAll('.nav-link').forEach((b, i) => {
                b.classList.remove('active', 'text-white/30');
                if(tabs[i] === tId) b.classList.add('active'); else b.classList.add('text-white/30');
            });
            document.getElementById(`tab-${tId}`).classList.remove('hidden');
        };
        window.copyR = () => { const l = document.getElementById('ref-l').innerText; if(l.includes("http")) { navigator.clipboard.writeText(l); alert("Copied!"); } };
    </script>
</body>
</html>
